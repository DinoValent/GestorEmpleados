services:
  db:
    image: postgres:16-alpine
    container_name: gestion-empleados-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: puntual
      POSTGRES_PASSWORD: puntual
      POSTGRES_DB: gestion_empleados
    ports:
      - "5434:5432"
    volumes:
      - gestion_empleados_db_data:/var/lib/postgresql/data

volumes:
  gestion_empleados_db_data:
